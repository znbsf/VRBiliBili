<style>

<script>
(()=>{

    {id:'city',title:'雨后的城市，适合慢慢走',up:'街角观察员',category:'旅行',duration:1125,art:'city',word:'城市漫游',subtitle:'每一条街，都有自己的节奏。',desc:'一段不赶时间的城市散步。经过街角咖啡店、地铁出口和傍晚的长桥。',parts:[{title:'01 雨后出发',duration:1125},{title:'02 黄昏的桥',duration:854}]},
    {id:'space',title:'如果把太阳系放到桌面上',up:'轨道之外',category:'知识',duration:624,art:'space',word:'轨道之外',subtitle:'换一个尺度，重新看熟悉的世界。',desc:'用日常物件理解行星之间的距离，从一个问题开始认识太阳系。',parts:[{title:'01 一个尺度问题',duration:624},{title:'02 行星与轨道',duration:810}]},
    {id:'studio',title:'一张桌子，也能成为理想工作室',up:'手作星期天',category:'生活',duration:896,art:'studio',word:'日常留白',subtitle:'把喜欢的东西，放在触手可及的地方。',desc:'记录一次小工作室的整理：光线、桌面和几个常用的小工具。',parts:[{title:'01 留出一片空白',duration:896}]},
    {id:'music',title:'湖边的声音｜安静的器乐现场',up:'晚风电台',category:'音乐',duration:1404,art:'valley',word:'晚风电台',subtitle:'这一刻，什么都不用做。',desc:'一场安静的示例器乐现场，适合让注意力回到声音本身。原型不含实际音频。',parts:[{title:'01 湖边的声音',duration:1404}]},
    {id:'design',title:'界面为什么需要留白？',up:'小小设计课',category:'知识',duration:582,art:'studio',word:'留白之间',subtitle:'让最重要的事情，更容易被看见。',desc:'从日常界面里的小细节，认识层级、留白和阅读节奏。',parts:[{title:'01 看见信息的层次',duration:582},{title:'02 给注意力留空间',duration:708}]}
  ];
  const clone=x=>JSON.parse(JSON.stringify(x));
  const panel=(x,y,size=100)=>({x,y,size,distance:2.5,locked:false,follow:true});
  const freshLayouts=()=>({
    focus:{opacity:88,visible:{queue:false,comments:false},panels:{main:panel(12,50),queue:panel(1,142),comments:panel(79,142)}},
    desk:{opacity:88,visible:{queue:true,comments:true},panels:{main:panel(23,65),queue:panel(1,135),comments:panel(79,135)}},
    social:{opacity:88,visible:{queue:false,comments:true},panels:{main:panel(9,62),queue:panel(1,145),comments:panel(77,110)}}
  });
  const defaults=()=>({version:1,view:'home',origin:'home',category:'全部',query:'',selected:'valley',part:0,layout:'focus',layouts:freshLayouts(),progress:{'valley:0':206},history:['valley:0'],later:['space'],library:'later',opacity:88,dim:32,environment:'room',subtitles:true,danmaku:'off',density:1,danmakuSize:16,speed:1,quality:'自动',volume:70,signed:false});
  let state=defaults(),playing=false,inspector='',selectedPanel='main',review='normal',elapsed=0,effectTimer=null,drag=null;
  const video=id=>catalog.find(v=>v.id===id)||catalog[0];

  const key=()=>state.selected+':'+state.part;
  const duration=()=>current().parts[state.part].duration;
  const layout=()=>state.layouts[state.layout];
  const time=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};

  function restore(snapshot){
    const s=snapshot?.privateContent;
    const object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
    if(!object(s)||s.version!==1)return;
    const next=defaults();
    const number=(value,fallback,min,max)=>typeof value==='number'&&Number.isFinite(value)?clamp(value,min,max):fallback;
    const choice=(value,allowed,fallback)=>allowed.includes(value)?value:fallback;
    next.selected=video(s.selected).id;
    next.part=Math.floor(number(s.part,0,0,video(next.selected).parts.length-1));
    next.view=choice(s.view,['home','detail','watch','library'],next.view);
    next.origin=choice(s.origin,['home','library'],'home');
    next.layout=choice(s.layout,['focus','desk','social'],next.layout);
    next.library=choice(s.library,['later','history'],next.library);
    next.category=choice(s.category,['全部','旅行','知识','音乐','生活'],next.category);
    next.query=typeof s.query==='string'?s.query:'';
    for(const name of ['focus','desk','social']){
      const stored=object(s.layouts?.[name])?s.layouts[name]:{},fresh=next.layouts[name];
      fresh.opacity=number(stored.opacity,number(s.opacity,88,35,100),35,100);
      for(const id of ['queue','comments'])if(typeof stored.visible?.[id]==='boolean')fresh.visible[id]=stored.visible[id];
      for(const id of ['main','queue','comments']){
        const p=fresh.panels[id],q=object(stored.panels?.[id])?stored.panels[id]:{};
        p.x=number(q.x,p.x,1,99);p.y=number(q.y,p.y,43,id==='main'?145:180);
        p.size=number(q.size,p.size,75,125);p.distance=number(q.distance,p.distance,1.5,3.5);
        if(typeof q.locked==='boolean')p.locked=q.locked;
        if(typeof q.follow==='boolean')p.follow=q.follow;
        if(id==='main'&&typeof q.widthBase==='number'&&Number.isFinite(q.widthBase))p.widthBase=clamp(q.widthBase,36,88);
      }
    }
    next.opacity=next.layouts[next.layout].opacity;
    next.returnView=['home','detail','library'].includes(s.returnView)?s.returnView:(next.origin==='library'?'library':'home');
    const validKey=k=>typeof k==='string'&&catalog.some(v=>v.parts.some((_,i)=>k===v.id+':'+i));
    if(object(s.progress)){next.progress={};for(const v of catalog)v.parts.forEach((p,i)=>{const k=v.id+':'+i;if(typeof s.progress[k]==='number'&&Number.isFinite(s.progress[k]))next.progress[k]=clamp(s.progress[k],0,p.duration)})}
    next.later=Array.isArray(s.later)?[...new Set(s.later.filter(id=>catalog.some(v=>v.id===id)))]:next.later;
    next.history=Array.isArray(s.history)?[...new Set(s.history.filter(validKey))].slice(0,30):next.history;
    next.dim=number(s.dim,next.dim,0,85);next.volume=number(s.volume,next.volume,0,100);
    next.density=Math.round(number(s.density,next.density,1,3));next.danmakuSize=choice(s.danmakuSize,[14,16,18,20,22,24],next.danmakuSize);
    next.speed=choice(s.speed,[.75,1,1.25,1.5,2],next.speed);next.quality=choice(s.quality,['自动','1080P','720P'],next.quality);
    next.environment=choice(s.environment,['room','cinema'],next.environment);next.danmaku=choice(s.danmaku,['off','flat','river'],next.danmaku);

  function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
  function art(v,caption=false){return '<div class="pv-art" data-art="'+v.art+'" role="img" aria-label="'+esc(v.word+'，原创示意插画')+'">'+(caption?'<div class="pv-art-caption"><small>PILI / SPATIAL</small><strong>'+v.word+'</strong></div><span class="pv-art-note">示意画面</span>':'')+'</div>'}
  function cards(items,history=false){
    if(!items.length)return '<div class="pv-empty"><h3>'+ (state.query?'没有找到相关视频':'这里还没有内容')+'</h3><p class="pv-muted">'+(state.query?'换一个词试试，比如「旅行」或「设计」。':'先去发现页，找一段想看的视频。')+'</p>'+button('clear-search','去发现','', 'pv-primary')+'</div>';
    return '<div class="pv-grid">'+items.map(item=>{const v=history?video(item.split(':')[0]):item;const part=history?Number(item.split(':')[1]):0;const p=state.progress[v.id+':'+part]||0;const d=v.parts[part].duration;return '<article class="pv-video-card">'+button(history?'resume-card':'detail','<div class="pv-art" data-art="'+v.art+'"><div class="pv-art-caption"><strong>'+v.word+'</strong></div><span class="pv-duration">'+time(d)+'</span></div><h3>'+esc(v.title)+'</h3>','data-id="'+v.id+'" data-part="'+part+'"')+'<p>'+esc(v.up)+' · '+(history?'看到 '+time(p):v.category)+'</p>'+(p?'<div class="pv-progress-track"><div class="pv-progress-fill" style="width:'+clamp(p/d*100,0,100)+'%"></div></div>':'')+'</article>'}).join('')+'</div>';
  }
  function renderHome(){

      (!state.query?'<div class="pv-hero"><div class="pv-hero-copy"><span class="pv-eyebrow">继续观看</span><h2>'+v.word+'，还没看完。</h2><p class="pv-muted">'+esc(v.title)+'</p><small class="pv-muted">上次看到 '+time(state.progress[last]||0)+'</small><div class="pv-row">'+button('resume-card',icon('play')+'接着看','data-id="'+v.id+'" data-part="'+part+'"','pv-primary')+button('detail','查看详情','data-id="'+v.id+'"','pv-quiet')+'</div></div>'+art(v,true)+'</div>':'<div class="pv-row pv-between pv-heading"><p class="pv-muted">“'+esc(state.query)+'” · '+matching.length+' 个示例结果</p>'+button('clear-search','清空搜索','','pv-quiet')+'</div>')+
      '<div class="pv-chips" aria-label="内容分类">'+['全部','旅行','知识','音乐','生活'].map(c=>button('category',c,'data-category="'+c+'" aria-pressed="'+(state.category===c)+'"')).join('')+'</div>'+cards(matching)+'</section>';

  function renderDetail(){
    const v=current();const saved=state.later.includes(v.id);
    content.innerHTML='<section class="pv-page">'+button('back-library',icon('arrow-left')+'返回片库','','pv-quiet')+'<div class="pv-detail">'+art(v,true)+'<div class="pv-detail-info"><span class="pv-eyebrow">'+v.category+' / 示例视频</span><h1>'+esc(v.title)+'</h1><p class="pv-muted">UP · '+esc(v.up)+'</p><p class="pv-description">'+v.desc+'</p><div class="pv-row">'+button('play-detail',icon('play')+(state.progress[key()]?'继续播放':'开始播放'),'','pv-primary')+button('later',icon(saved?'bookmark-check':'bookmark')+(saved?'已加入稍后再看':'稍后再看'),'aria-pressed="'+saved+'"')+'</div></div></div><section class="pv-section"><div class="pv-row pv-between"><h2>选集</h2><span class="pv-muted">'+v.parts.length+' 段内容</span></div><div class="pv-episode-list">'+v.parts.map((p,i)=>button('select-detail','<span>'+esc(p.title)+'</span><small>'+time(p.duration)+'</small>','data-part="'+i+'" aria-pressed="'+(state.part===i)+'"')).join('')+'</div></section></section>';
  }
  function renderLibrary(){
    content.innerHTML='<section class="pv-page"><div class="pv-row pv-between pv-heading"><div><h1>我的片库</h1><p class="pv-muted" style="margin-top:6px">'+(state.signed?'体验账号 · 已登录示意':'访客 · 观看记录暂存在此原型')+'</p></div>'+button('login',state.signed?'退出体验账号':'登录并同步','','pv-quiet')+'</div><div class="pv-chips">'+button('library-tab',icon('bookmark')+'稍后再看','data-tab="later" aria-pressed="'+(state.library==='later')+'"')+button('library-tab',icon('history')+'历史记录','data-tab="history" aria-pressed="'+(state.library==='history')+'"')+'</div>'+cards(state.library==='history'?state.history:state.later.map(video),state.library==='history')+'</section>';

  function grip(id,label){return '<div class="pv-grip" data-drag="'+id+'">'+icon('grip-horizontal')+'<span class="pv-grip-name">'+esc(label)+'</span><span data-lock-label="'+id+'"></span>'+(id!=='main'?button('toggle-panel',icon('x'),'data-panel="'+id+'" aria-label="收起'+(id==='queue'?'选集':'评论')+'"'):'')+'</div>'}

  function renderWatch(){

    content.innerHTML='<div class="pv-view-top pv-row pv-between">'+button('exit-watch',icon('arrow-left')+returnLabel,'','pv-quiet')+'<div class="pv-row" aria-label="观看布局">'+[['focus','专注'],['desk','桌面'],['social','陪伴']].map(([id,label])=>button('layout',label,'data-layout="'+id+'" aria-pressed="'+(state.layout===id)+'"','pv-quiet')).join('')+'</div></div>'+
      '<section class="pv-stage" id="pv-stage" aria-label="空间窗口二维预览"><span class="pv-stage-label">PILI SPACE · '+({focus:'专注观看',desk:'展开工作区',social:'一起看弹幕'}[state.layout])+'</span>'+
      '<section class="pv-window" data-panel="main" aria-label="主视频窗口">'+grip('main',v.title)+'<div class="pv-film" id="pv-film">'+art(v,true)+'<div class="pv-subtitle" id="pv-subtitle">'+v.subtitle+'</div><div id="pv-play-status" class="pv-status-overlay" hidden></div></div><div class="pv-transport"><input type="range" id="pv-seek" aria-label="视频进度" min="0" max="'+duration()+'" step="1" value="'+(state.progress[key()]||0)+'"><div class="pv-row pv-between"><div class="pv-row">'+button('previous',icon('skip-back'),'aria-label="播放上一段" '+(state.part===0?'disabled':''))+button('play',icon(playing?'pause':'play')+(playing?'暂停':'播放'))+button('next',icon('skip-forward'),'aria-label="播放下一段" '+(state.part===v.parts.length-1?'disabled':''))+'<small id="pv-time"></small></div><small id="pv-speed-label">'+state.speed+'× · '+esc(state.quality)+'</small></div></div></section>'+

      '<div class="pv-dock" aria-label="观看工具">'+button('toggle-panel',icon('list-video')+'选集','data-panel="queue" aria-pressed="'+layout().visible.queue+'"')+button('toggle-panel',icon('messages-square')+'评论','data-panel="comments" aria-pressed="'+layout().visible.comments+'"')+button('inspector',icon('message-circle')+'弹幕','data-tool="danmaku" aria-pressed="'+(inspector==='danmaku')+'"')+button('inspector',icon('move')+'摆放','data-tool="layout" aria-pressed="'+(inspector==='layout')+'"')+button('inspector',icon('sliders-horizontal')+'观看设置','data-tool="settings" aria-pressed="'+(inspector==='settings')+'"')+button('recall',icon('locate-fixed')+'召回窗口')+'</div><section id="pv-inspector" class="pv-inspector" hidden></section>';
    applyStage();renderInspector();updateTime();renderPlaybackStatus();

  function renderInspector(){
    const box=root.querySelector('#pv-inspector');if(!box)return;
    box.hidden=!inspector;if(!inspector)return;

    if(inspector==='layout'){

  window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming.privateContent)!==JSON.stringify(state)){stopEffects();restore(incoming);inspector='';review='normal';render()}});
  restore(window.openai?.widgetState);render();
  if(globalThis.ResizeObserver)new ResizeObserver(()=>{if(state.view==='watch')applyStage()}).observe(root);
  if(globalThis.Tweak){const appearance={radius:20,accent:'#b82661'};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--pv-radius',appearance.radius+'px');root.style.setProperty('--pv-accent',appearance.accent);root.style.setProperty('--pv-on','#ffffff')}});tweak.addSlider(appearance,'radius',{label:'表面圆角',min:6,max:28,unit:'px'});tweak.addColorPicker(appearance,'accent',{label:'强调色',reference:'--pv-accent'})}
})();
</script>
